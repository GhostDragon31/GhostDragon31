<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link href="StyleSheet-BusinessCard.css" rel="stylesheet" />
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="Pink daisy-like flower">
        <p class="full-name">John Doe</p>
        <p class="designation">University Professor</p>
        <p class="company">University of IT</p>
        <hr>
        <p class="email">Example@email.com</p>
        <p class="number">5555555 5555</p>
        <a class="portfolio-link" href="https://www.freecodecamp.org">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a class="twitter" href="https://x.com">Twitter</a>
            <a class="LinkedIn" href="https://www.linkedin.com/home">LinkedIn</a>
            <a class="GitHub" href="https://github.com">GitHub</a>
        </div>
    </div>
</body>

</html>
