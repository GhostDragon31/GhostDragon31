<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="StyleSheet" href="Blog-Card.css" />
</head>
<body>
    <div class="blog-post-card">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Person working on a laptop." class="post-img">
        <div class="post-content">
            <h2 class="post-title">Blog Post Title</h2>
            <p class="post-excerpt">This is an example of a blog post card.</p>
            <a class="read-more" href="https://www.google.com/" target="_blank"> Read More</a>
        </div>
    </div>
</body>
</html>
