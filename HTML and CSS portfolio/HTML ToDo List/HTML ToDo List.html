<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="StyleSheet-Todo.css" rel="stylesheet">
</head>

<body>
    <h1>My Todo List - Holiday Getaway!</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="task-1"><label for="task-1">Pack suitcase</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.google.com" target="_blank">Shoes</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task-2"><label for="task-2">Feed fish</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.youtube.com/?gl=GB&hl=en-GB" target="_blank">Front room fish tank</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task-3"><label for="task-3">Find passport</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">Check wardrobe</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task-4"><label for="task-4">Water plants</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">Orchid</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
